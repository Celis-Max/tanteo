# Tanteo: sirve los archivos estáticos que genera el pipeline.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/tanteo/web;
    index index.html;

    # index.html es el splash con sonido; inicio.html es el menú principal.

    # datos.js es lo único que cambia a diario y pesa ~780 KB: se comprime y
    # NO se cachea, para que al recargar siempre salgan los datos del día.
    location = /datos.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # El resto (css, js, fuentes, escudos, la foto de marca) casi no cambia.
    location ~* \.(css|js|woff2|jpg|png|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    access_log /var/log/nginx/tanteo.access.log;
    error_log  /var/log/nginx/tanteo.error.log;
}
