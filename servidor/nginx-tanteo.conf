# Tanteo: sirve los archivos estáticos que genera el pipeline.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/tanteo/web;
    index index.html;

    # index.html es el splash con sonido; inicio.html es el menú principal.

    # datos.js es lo único que cambia a diario y pesa ~780 KB: se comprime y
    # NO se cachea, para que al recargar siempre salgan los datos del día.
    location = /datos.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fuentes e imágenes casi nunca cambian: una semana está bien.
    location ~* \.(woff2|jpg|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # El css y el js SÍ cambian, y conservan el nombre entre versiones.
    # Con `expires 7d` un cambio de diseño tardaba una semana en verse, y
    # entretanto el navegador servía el archivo viejo sin avisar: eso ya nos
    # pasó en Pages y costó un rato averiguar que no era un fallo del código.
    # Una hora, y además revalidación, que es barata: si no cambió, nginx
    # responde 304 y no manda nada.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    access_log /var/log/nginx/tanteo.access.log;
    error_log  /var/log/nginx/tanteo.error.log;
}
