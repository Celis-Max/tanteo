<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanteo · Splash</title>
<link rel="icon" href="assets/img/tanteo-keyart.jpg">
<link rel="stylesheet" href="assets/css/fuentes.css">
<link rel="stylesheet" href="assets/css/adaptable.css">
<style>
body{margin:0;background:#050F0A;font-family:Manrope,system-ui,sans-serif;color:#F3EFE6}
a{color:#E4C877}
.table{position:relative;background-color:#0F3D2E;background-image:radial-gradient(ellipse 130% 90% at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.7) 100%),repeating-radial-gradient(circle at 0 0,rgba(0,0,0,0) 0 30px,rgba(255,255,255,.026) 31px 32px,rgba(0,0,0,0) 33px 60px),repeating-radial-gradient(circle at 70px 70px,rgba(0,0,0,0) 0 18px,rgba(0,0,0,.06) 19px 20px,rgba(0,0,0,0) 21px 40px),radial-gradient(rgba(255,255,255,.05) .7px,rgba(0,0,0,0) 1.2px),radial-gradient(rgba(0,0,0,.14) .7px,rgba(0,0,0,0) 1.2px);background-size:100% 100%,140px 140px,140px 140px,4px 4px,6px 6px}
.dark{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(2,8,5,.78);transition:opacity 1.4s ease;pointer-events:none}
.go .dark{opacity:0}
.lamp{position:absolute;left:170px;top:-260px;width:1100px;height:1000px;border-radius:50%;background:radial-gradient(closest-side,rgba(210,245,200,.26),rgba(210,245,200,.08) 55%,rgba(0,0,0,0));opacity:0;transition:opacity 1.6s ease .1s}
.go .lamp{opacity:1}
.paper{background-color:#F6F1E6;background-image:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(0,0,0,.07) 100%),radial-gradient(rgba(60,40,20,.10) .8px,rgba(0,0,0,0) 1.3px),radial-gradient(rgba(60,40,20,.06) .8px,rgba(0,0,0,0) 1.3px);background-size:100% 100%,9px 9px,13px 13px;color:#1A1414}
.logo{position:absolute;left:420px;top:190px;width:600px;height:380px;border-radius:26px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 0 30px rgba(120,90,50,.22),0 2px 2px rgba(0,0,0,.4),0 30px 60px rgba(0,0,0,.55),0 60px 120px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;opacity:0;transform:translate(-760px,-560px) rotate(-70deg) scale(1.15)}
.go .logo{animation:deal 1.05s cubic-bezier(.2,.8,.25,1.06) .05s forwards}
@keyframes deal{0%{opacity:1;transform:translate(-760px,-560px) rotate(-70deg) scale(1.15)}100%{opacity:1;transform:translate(0,0) rotate(-6deg) scale(1)}}
.logotxt{font-family:'Great Vibes',cursive;font-size:200px;line-height:1;padding:0 30px 20px;background:linear-gradient(100deg,#2A0808 0%,#C1121F 20%,#E3232C 38%,#6E0A12 52%,#C1121F 68%,#2A0606 100%);-webkit-background-clip:text;background-clip:text;color:rgba(0,0,0,0)}
.chip{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.30),rgba(255,255,255,0) 45%),radial-gradient(circle,var(--c) 0 52%,#EDE6D6 53% 55%,rgba(0,0,0,0) 56%),repeating-conic-gradient(#EDE6D6 0 12deg,var(--c) 12deg 45deg);box-shadow:inset 0 0 0 3px rgba(0,0,0,.2),inset 0 -4px 0 rgba(0,0,0,.25),0 2px 0 rgba(0,0,0,.35),0 14px 22px rgba(0,0,0,.5)}
.drop{opacity:0}
.go .drop{animation:drop .55s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes drop{0%{opacity:0;transform:translateY(-260px) scale(1.25)}55%{opacity:1}100%{opacity:1;transform:none}}
.ace{position:absolute;width:150px;height:214px;border-radius:12px;box-sizing:border-box;padding:12px;font-family:'Bodoni Moda',serif;transform-origin:50% 100%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 0 20px rgba(120,90,50,.2),0 2px 2px rgba(0,0,0,.35),0 20px 36px rgba(0,0,0,.5);opacity:0}
.go .ace{animation:fan .55s cubic-bezier(.2,.9,.3,1.1) forwards}
@keyframes fan{0%{opacity:0;transform:translateY(60px) rotate(0deg)}100%{opacity:1;transform:rotate(var(--r))}}
.wheelwrap{position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#7A2A2E,#4A1216 55%,#2A0709);box-shadow:inset 0 2px 0 rgba(255,255,255,.15),inset 0 -8px 16px rgba(0,0,0,.5),0 0 0 4px #9C7A33,0 30px 60px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0}
.go .wheelwrap{animation:rise .7s ease-out .9s forwards}
.wheel{width:300px;height:300px;border-radius:50%;position:relative;background:radial-gradient(circle,rgba(0,0,0,0) 0 57%,#C9A24A 57.5% 59%,rgba(0,0,0,0) 59.5%),repeating-conic-gradient(rgba(233,207,131,.9) 0 .7deg,rgba(0,0,0,0) .7deg 9.73deg),conic-gradient(#1F7A3A 0 9.73deg,rgba(0,0,0,0) 9.73deg),repeating-conic-gradient(#B3101C 0 9.73deg,#151010 9.73deg 19.46deg);box-shadow:0 0 0 6px #C9A24A,inset 0 0 20px rgba(0,0,0,.5)}
.go .wheel{animation:spin 3.4s cubic-bezier(.12,.55,.3,1) 1.2s forwards}
@keyframes spin{to{transform:rotate(1440deg)}}
.cone{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8A3A2E,#4A1A12 60%,#2A0D08);box-shadow:0 0 0 3px #C9A24A,0 6px 14px rgba(0,0,0,.5)}
.turret{position:absolute;left:50%;top:50%;width:120px;height:10px;margin:-5px 0 0 -60px;border-radius:5px;background:linear-gradient(180deg,#F7E3A0,#A57A2A)}
.turret.v{transform:rotate(90deg)}
.knob{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3C4,#C9A24A 55%,#6E4F16);box-shadow:0 4px 8px rgba(0,0,0,.5)}
.ballorb{position:absolute;left:0;top:0;width:380px;height:380px}
.go .ballorb{animation:spinb 3.4s cubic-bezier(.12,.55,.3,1) 1.2s forwards}
@keyframes spinb{to{transform:rotate(-1260deg)}}
.ball{position:absolute;left:182px;top:30px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF,#D9D4C8 60%,#8C877C);box-shadow:0 3px 5px rgba(0,0,0,.5)}
.rise{opacity:0}
.go .rise{animation:rise .7s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
.dia{position:absolute;width:18px;height:18px;background:linear-gradient(135deg,#F7E3A0,#A57A2A 60%,#6E4F16);transform:rotate(45deg);box-shadow:0 4px 8px rgba(0,0,0,.55)}
.cta{display:flex;align-items:center;gap:12px;padding:20px 38px;border-radius:999px;background:#C1121F;color:#FFFFFF;text-decoration:none;font-weight:800;font-size:19px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 3px #F3DC92,0 18px 34px rgba(0,0,0,.5)}
.cta:hover{color:#FFFFFF;background:#D0141F}
.start{border:0;cursor:pointer;width:190px;height:190px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#FFFFFF;font:800 15px Manrope,sans-serif;letter-spacing:.12em;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.30),rgba(255,255,255,0) 45%),radial-gradient(circle,#C1121F 0 52%,#EDE6D6 53% 55%,rgba(0,0,0,0) 56%),repeating-conic-gradient(#EDE6D6 0 12deg,#C1121F 12deg 45deg);box-shadow:0 0 0 4px #F3DC92,0 0 0 60px rgba(243,220,146,.06),0 24px 40px rgba(0,0,0,.6);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.start:focus-visible,.mute:focus-visible{outline:3px solid #F3DC92;outline-offset:6px}
.mute{border:1px solid rgba(228,200,119,.6);background:rgba(4,18,12,.6);color:#F3EFE6;border-radius:999px;padding:12px 20px;display:flex;gap:10px;align-items:center;font:700 14px Manrope,sans-serif;cursor:pointer}
</style>
<style>#page{max-width:1440px;width:100%;margin:0 auto}</style>
<style>
/* La plantilla trae el lienzo clavado en 1440x900 y lo declara en tres
   sitios distintos, cada uno tapando al siguiente; por eso esto va al
   final, donde ya nadie lo pisa.

   La intro no se re-maqueta para cada pantalla: se escala entera. Es una
   portada con una composición pensada al milímetro —las fichas caen donde
   caen— y re-fluirla la desarma. Escalar conserva el encuadre y en el
   teléfono se ve lo mismo, más chico. */
#page{display:flex;align-items:center;justify-content:center;min-height:100vh;max-width:none;overflow:hidden}
#dc-root{transform:scale(var(--esc,1));transform-origin:center;flex:none}
</style>
</head>
<body>
<div id="page"><div id="dc-root"></div></div>
<template id="dc-tpl">
<div class="table {{goCls}}" style="width: 1440px; height: 900px; overflow: hidden">
<div class="lamp"></div>

<div class="chip drop" style="--c: #1F5E47; left: 130px; top: 520px; width: 120px; height: 120px; animation-delay: .55s"></div>
<div class="chip drop" style="--c: #1A1414; left: 150px; top: 500px; width: 120px; height: 120px; animation-delay: .65s"></div>
<div class="chip drop" style="--c: #C1121F; left: 170px; top: 480px; width: 120px; height: 120px; animation-delay: .75s"></div>
<div class="chip drop" style="--c: #1F4E8C; left: 260px; top: 640px; width: 96px; height: 96px; animation-delay: .85s"></div>
<div class="chip drop" style="--c: #C1121F; left: 80px; top: 690px; width: 96px; height: 96px; animation-delay: .95s"></div>
<div class="chip drop" style="--c: #1A1414; left: 60px; top: 120px; width: 104px; height: 104px; animation-delay: .7s"></div>
<div class="chip drop" style="--c: #1F5E47; left: 180px; top: 70px; width: 90px; height: 90px; animation-delay: .8s"></div>

<div class="wheelwrap" style="left: 1080px; top: -60px">
<div class="wheel"><span class="cone"></span><span class="turret"></span><span class="turret v"></span><span class="knob"></span></div>
<div class="ballorb"><span class="ball"></span></div>
</div>
<div class="dia rise" style="left: 1030px; top: 350px; animation-delay: 1s"></div>
<div class="dia rise" style="left: 1380px; top: 380px; animation-delay: 1.1s"></div>

<div class="ace paper" style="--r: -24deg; left: 1050px; top: 560px; color: #1A1414; animation-delay: 1.15s"><div style="font-size: 28px; font-weight: 700; line-height: 1">A</div><div style="font-size: 22px; line-height: 1">♠</div><div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 76px; line-height: 1">♠</div></div>
<div class="ace paper" style="--r: -8deg; left: 1100px; top: 540px; color: #C1121F; animation-delay: 1.23s"><div style="font-size: 28px; font-weight: 700; line-height: 1">A</div><div style="font-size: 22px; line-height: 1">♦</div><div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 76px; line-height: 1">♦</div></div>
<div class="ace paper" style="--r: 8deg; left: 1150px; top: 540px; color: #1A1414; animation-delay: 1.31s"><div style="font-size: 28px; font-weight: 700; line-height: 1">A</div><div style="font-size: 22px; line-height: 1">♣</div><div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 76px; line-height: 1">♣</div></div>
<div class="ace paper" style="--r: 24deg; left: 1200px; top: 560px; color: #C1121F; animation-delay: 1.39s"><div style="font-size: 28px; font-weight: 700; line-height: 1">A</div><div style="font-size: 22px; line-height: 1">♥</div><div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 76px; line-height: 1">♥</div></div>

<div class="logo paper"><span class="logotxt">Tanteo</span></div>

<div class="rise" style="position: absolute; left: 420px; top: 620px; width: 600px; display: flex; flex-direction: column; align-items: center; gap: 16px; animation-delay: 1.3s">
<div style="font-size: 13px; letter-spacing: .3em; font-weight: 800; color: #E4C877">LIGA MX · APERTURA 2026</div>
<sc-if value="{{loading}}" hint-placeholder-val="{{true}}">
<div style="position: relative; width: 460px; height: 12px; border-radius: 999px; background: rgba(0,0,0,.45); box-shadow: inset 0 2px 4px rgba(0,0,0,.6), 0 0 0 1px rgba(228,200,119,.45)">
<div style="width: {{pct}}%; height: 12px; border-radius: 999px; background: linear-gradient(90deg, #8C6A22, #F3DC92, #C9A24A)"></div>
<span class="chip" style="--c: #C1121F; left: {{pct}}%; top: -9px; width: 30px; height: 30px; margin-left: -15px"></span>
</div>
<div style="display: flex; gap: 14px; align-items: baseline"><span style="font-family: 'Great Vibes', cursive; font-size: 34px; color: #F3EFE6">{{tip}}</span><span style="font-family: 'Bodoni Moda', serif; font-size: 18px; font-weight: 700; color: #F3DC92">{{pct}}%</span></div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<a href="{{destino}}" class="cta"><span style="font-size: 18px">♦</span>Entrar a la mesa</a>
<button onClick="{{start}}" style="border: 0; background: rgba(0,0,0,0); color: #E4C877; font: 700 14px Manrope, sans-serif; cursor: pointer; padding: 8px">Repartir de nuevo</button>
</sc-if>
</div>

<div class="dark"></div>

<sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px">
<div style="font-family: 'Great Vibes', cursive; font-size: 64px; color: #F3EFE6; text-shadow: 0 4px 18px rgba(0,0,0,.6)">La mesa está por abrir</div>
<button class="start" onClick="{{start}}" aria-label="Repartir y entrar"><span style="font-family: 'Bodoni Moda', serif; font-size: 34px; letter-spacing: 0">♦</span>REPARTIR</button>
<div style="font-size: 14px; color: #C9D8CF">Mejor con sonido · Probabilidades de la Liga MX · Sin apuestas</div>
</div>
</sc-if>

<button class="mute" onClick="{{toggleMute}}" aria-pressed="{{mutedStr}}" style="position: absolute; right: 36px; bottom: 30px">
<sc-if value="{{soundOn}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></sc-if><sc-if value="{{muted}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg></sc-if>
<span>{{muteLabel}}</span>
</button>
</div>
</template>
<script>
/* En cuanto se abre la intro queda marcada la sesión, de modo que las demás
   páginas ya no rebotan aquí. Se marca al ABRIR y no al entrar a la mesa:
   si alguien llega, no reparte y se va a inicio.html por el historial, no
   debe quedar atrapado volviendo a la intro una y otra vez. */
try { sessionStorage.setItem("tanteo.enmesa", "1"); } catch (e) {}

/* La intro está compuesta sobre un lienzo fijo de 1440x900. En vez de
   rehacer la composición para cada pantalla, se escala entera: es una
   portada, no una página de lectura, y así conserva su encuadre exacto. */
(function(){
  function ajustar(){
    var e = Math.min(1, innerWidth / 1440, innerHeight / 900);
    document.documentElement.style.setProperty("--esc", e.toFixed(4));
  }
  ajustar();
  addEventListener("resize", ajustar, { passive: true });
})();
</script>
<script src="assets/js/tanteo-runtime.js"></script>
<script>
class Component extends DCLogic {
constructor(...args) {
super(...args);
this.state = { phase: 'idle', pct: 0, muted: false };
// A dónde se entra al terminar. Se limita a las páginas conocidas: un ?ir=
// venido de fuera no debe poder mandar a nadie a otro sitio.
var PAGINAS = ['inicio.html','en-vivo.html','parlays.html','simulador.html'];
var pide = new URLSearchParams(location.search).get('ir');
this.destino = PAGINAS.indexOf(pide) >= 0 ? pide : 'inicio.html';
this.timers = [];
this.SND = {
entrada: 'assets/sonidos/tanteo-entrada.mp3',
carta: 'assets/sonidos/tanteo-carta-repartir.mp3',
voltear: 'assets/sonidos/tanteo-carta-voltear.mp3',
apilar: 'assets/sonidos/tanteo-fichas-apilar.mp3',
ruleta: 'assets/sonidos/tanteo-ruleta.mp3',
ganar: 'assets/sonidos/tanteo-ganar.mp3',
ambiente: 'assets/sonidos/tanteo-ambiente-mesa.mp3'
};
this.VOL = { entrada: .8, carta: .9, voltear: .8, apilar: .9, ruleta: .75, ganar: .55, ambiente: .25 };
}
componentWillUnmount() { this.reset(); }
reset() {
this.timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
this.timers = [];
if (this.amb) { try { this.amb.pause(); } catch (e) {} this.amb = null; }
}
snd(k) {
if (this.state.muted) return;
try { var a = new Audio(this.SND[k]); a.volume = this.VOL[k] || 1; var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
}
ambient() {
if (this.state.muted || this.amb) return;
try { this.amb = new Audio(this.SND.ambiente); this.amb.loop = true; this.amb.volume = this.VOL.ambiente; var p = this.amb.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
}
renderVals() {
var self = this;
var ph = this.state.phase;
var pct = this.state.pct;
var tip = pct < 25 ? 'Leyendo resultados…' : pct < 50 ? 'Revisando alineaciones…' : pct < 75 ? 'Consultando el clima…' : pct < 95 ? 'Calculando probabilidades…' : 'La mesa está lista';
return {
goCls: ph === 'go' || ph === 'done' ? 'go' : '',
idle: ph === 'idle', loading: ph !== 'done', done: ph === 'done',
pct: pct, tip: tip,
destino: this.destino,
muted: this.state.muted, soundOn: !this.state.muted, mutedStr: this.state.muted ? 'true' : 'false',
muteLabel: this.state.muted ? 'Sonido apagado' : 'Sonido encendido',
toggleMute: function () {
var m = !self.state.muted;
self.setState({ muted: m });
if (m && self.amb) { try { self.amb.pause(); } catch (e) {} self.amb = null; }
if (!m && self.state.phase !== 'idle') { setTimeout(function () { self.ambient(); }, 0); }
},
start: function () {
self.reset();
self.setState({ phase: 'reset', pct: 0 });
self.timers.push(setTimeout(function () {
self.setState({ phase: 'go' });
self.snd('entrada');
self.timers.push(setTimeout(function () { self.snd('carta'); }, 80));
self.timers.push(setTimeout(function () { self.snd('apilar'); }, 620));
self.timers.push(setTimeout(function () { self.snd('voltear'); }, 1180));
self.timers.push(setTimeout(function () { self.snd('ruleta'); }, 1250));
self.timers.push(setTimeout(function () { self.ambient(); }, 1600));
self.timers.push(setTimeout(function () {
var iv = setInterval(function () {
var n = Math.min(100, self.state.pct + 2);
self.setState({ pct: n });
if (n >= 100) { clearInterval(iv); self.setState({ phase: 'done' }); self.snd('ganar'); }
}, 66);
self.timers.push(iv);
}, 1300));
}, 60));
}
};
}
}
TanteoDC.mount(Component);
</script>
</body>
</html>
