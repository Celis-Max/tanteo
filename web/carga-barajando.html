<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanteo · Carga: barajando</title>
<link rel="icon" href="assets/img/tanteo-keyart.jpg">
<link rel="stylesheet" href="assets/css/fuentes.css">
<link rel="stylesheet" href="assets/css/adaptable.css">
<style>
body{margin:0;background:#050F0A;font-family:Manrope,system-ui,sans-serif;color:#F3EFE6}
.table{position:relative;background-color:#0F3D2E;background-image:radial-gradient(ellipse 900px 700px at 50% 40%,rgba(210,245,200,.20),rgba(0,0,0,0) 70%),radial-gradient(ellipse 130% 90% at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.7) 100%),repeating-radial-gradient(circle at 0 0,rgba(0,0,0,0) 0 30px,rgba(255,255,255,.026) 31px 32px,rgba(0,0,0,0) 33px 60px),repeating-radial-gradient(circle at 70px 70px,rgba(0,0,0,0) 0 18px,rgba(0,0,0,.06) 19px 20px,rgba(0,0,0,0) 21px 40px),radial-gradient(rgba(255,255,255,.05) .7px,rgba(0,0,0,0) 1.2px),radial-gradient(rgba(0,0,0,.14) .7px,rgba(0,0,0,0) 1.2px);background-size:100% 100%,100% 100%,140px 140px,140px 140px,4px 4px,6px 6px}
.paper{background-color:#F6F1E6;background-image:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(0,0,0,.07) 100%),radial-gradient(rgba(60,40,20,.10) .8px,rgba(0,0,0,0) 1.3px);background-size:100% 100%,9px 9px;color:#1A1414}
.back{position:absolute;width:130px;height:186px;border-radius:12px;background-color:#9E1520;background-image:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0) 45%),repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 2px,rgba(0,0,0,0) 2px 9px),repeating-linear-gradient(-45deg,rgba(255,255,255,.16) 0 2px,rgba(0,0,0,0) 2px 9px);box-shadow:inset 0 0 0 7px #F4F0E7,inset 0 0 0 9px #7A0F17,0 2px 2px rgba(0,0,0,.4),0 14px 26px rgba(0,0,0,.5)}
.fly{left:195px;top:40px;animation:riffle 1.3s cubic-bezier(.45,.05,.55,.95) infinite;opacity:0}
@keyframes riffle{0%{opacity:0;transform:translate(-150px,20px) rotate(-10deg)}12%{opacity:1}50%{transform:translate(0,-110px) rotate(0deg)}88%{opacity:1}100%{opacity:0;transform:translate(150px,20px) rotate(10deg)}}
.chip{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.30),rgba(255,255,255,0) 45%),radial-gradient(circle,var(--c) 0 52%,#EDE6D6 53% 55%,rgba(0,0,0,0) 56%),repeating-conic-gradient(#EDE6D6 0 12deg,var(--c) 12deg 45deg);box-shadow:inset 0 0 0 3px rgba(0,0,0,.2),inset 0 -4px 0 rgba(0,0,0,.25),0 2px 0 rgba(0,0,0,.35),0 14px 22px rgba(0,0,0,.5)}
.bar{position:relative;width:460px;height:12px;border-radius:999px;overflow:hidden;background:rgba(0,0,0,.45);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1px rgba(228,200,119,.45)}
.bar span{position:absolute;top:0;left:-40%;width:40%;height:12px;border-radius:999px;background:linear-gradient(90deg,rgba(243,220,146,0),#F3DC92,rgba(243,220,146,0));animation:slide 1.4s ease-in-out infinite}
@keyframes slide{to{left:100%}}
.mute{border:1px solid rgba(228,200,119,.6);background:rgba(4,18,12,.6);color:#F3EFE6;border-radius:999px;padding:12px 20px;display:flex;gap:10px;align-items:center;font:700 14px Manrope,sans-serif;cursor:pointer}
.mute:focus-visible{outline:3px solid #F3DC92;outline-offset:4px}
.dots span{display:inline-block;animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
</style>
<style>#page{max-width:1440px;width:100%;margin:0 auto}</style>
</head>
<body>
<div id="page"><div id="dc-root"></div></div>
<template id="dc-tpl">
<div class="table">
<div class="paper" style="position: absolute; left: 44px; top: 34px; padding: 4px 18px; border-radius: 8px; transform: rotate(-4deg); box-shadow: 0 2px 2px rgba(0,0,0,.4), 0 10px 18px rgba(0,0,0,.5); font-family: 'Great Vibes', cursive; font-size: 40px; color: #C1121F">Tanteo</div>
<div class="chip" style="--c: #1F5E47; left: -30px; top: 640px; width: 130px; height: 130px"></div>
<div class="chip" style="--c: #C1121F; left: 70px; top: 700px; width: 110px; height: 110px"></div>
<div class="chip" style="--c: #1A1414; left: 1330px; top: 90px; width: 120px; height: 120px"></div>
<div class="chip" style="--c: #1F4E8C; left: 1290px; top: 170px; width: 96px; height: 96px"></div>

<div style="position: relative; width: 520px; height: 300px; margin-top: 180px">
<div class="back" style="left: 50px; top: 70px; transform: rotate(-8deg)"></div>
<div class="back" style="left: 46px; top: 64px; transform: rotate(-7deg)"></div>
<div class="back" style="left: 42px; top: 58px; transform: rotate(-6deg)"></div>
<div class="back" style="left: 340px; top: 70px; transform: rotate(8deg)"></div>
<div class="back" style="left: 344px; top: 64px; transform: rotate(7deg)"></div>
<div class="back" style="left: 348px; top: 58px; transform: rotate(6deg)"></div>
<div class="back fly" style="animation-delay: 0s"></div>
<div class="back fly" style="animation-delay: .22s"></div>
<div class="back fly" style="animation-delay: .44s"></div>
<div class="back fly" style="animation-delay: .66s"></div>
<div class="back fly" style="animation-delay: .88s"></div>
<div class="back fly" style="animation-delay: 1.1s"></div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 30px">
<div style="font-family: 'Great Vibes', cursive; font-size: 72px; line-height: 1; text-shadow: 0 4px 16px rgba(0,0,0,.6)">Barajando la jornada<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
<div class="bar"><span></span></div>
<div class="paper" style="margin-top: 16px; padding: 16px 24px; border-radius: 12px; transform: rotate(-1.5deg); box-shadow: 0 2px 2px rgba(0,0,0,.35), 0 16px 30px rgba(0,0,0,.45); display: flex; gap: 14px; align-items: center; max-width: 560px">
<span style="font-family: 'Bodoni Moda', serif; font-size: 30px; color: #C1121F; line-height: 1">♥</span>
<div><div style="font-size: 11px; font-weight: 800; letter-spacing: .16em; color: #5A4C44">¿SABÍAS QUE?</div><div style="font-size: 16px; font-weight: 700; line-height: 1.45">{{tip}}</div></div>
</div>
</div>

<button class="mute" onClick="{{toggle}}" aria-pressed="{{onStr}}" style="position: absolute; right: 36px; bottom: 30px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
<span>{{label}}</span>
</button>
<div style="position: absolute; left: 44px; bottom: 36px; font-size: 13px; color: #C9D8CF">Plataforma informativa · sin apuestas</div>
</div>
</template>
<script src="assets/js/tanteo-runtime.js"></script>
<script>
class Component extends DCLogic {
constructor(...args) {
super(...args);
this.state = { i: 0, on: false };
this.tips = ['En una combinación, todos los pronósticos deben cumplirse: por eso su probabilidad baja con cada carta.', 'Dos pronósticos de 50% juntos tienen 25% de cumplirse.', 'El modelo también revisa el clima: lluvia, calor y altitud pueden cambiar un partido.', 'Los primeros seis de la tabla van directo a la Liguilla; del 7º al 10º juegan el Play-In.'];
this.url = 'assets/sonidos/tanteo-barajar.mp3';
}
componentDidMount() {
var self = this;
this.tipTimer = setInterval(function () { self.setState({ i: (self.state.i + 1) % self.tips.length }); }, 3200);
}
componentWillUnmount() { clearInterval(this.tipTimer); this.stop(); }
play() { try { var a = new Audio(this.url); a.volume = .8; var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
stop() { if (this.loop) { clearInterval(this.loop); this.loop = null; } }
renderVals() {
var self = this;
return {
tip: this.tips[this.state.i],
label: this.state.on ? 'Silenciar' : 'Escuchar sonido',
onStr: this.state.on ? 'true' : 'false',
toggle: function () {
if (self.state.on) { self.stop(); self.setState({ on: false }); }
else { self.play(); self.loop = setInterval(function () { self.play(); }, 2400); self.setState({ on: true }); }
}
};
}
}
TanteoDC.mount(Component);
</script>
</body>
</html>
